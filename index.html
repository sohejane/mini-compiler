<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" href="https://i.imgur.com/Cb6agMF.png" type="image/x-icon">
  <title>soheng's mini compiler</title>

  <!-- CodeMirror -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/htmlmixed/htmlmixed.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/php/php.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/clike/clike.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/theme/dracula.min.css">
  
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background-color: #f3e5f5;
      color: #6a1b9a;
      transition: background-color 0.3s, color 0.3s;
    }

    #output {
      flex: 1;
      border: 1px solid #b39ddb;
      overflow: auto;
      background-color: #fff;
      color: #6a1b9a;
      height: 50%;
      margin-top: 0; 
    }

    #output.expanded {
      height: 100vh;
    }

    #editor-container {
      height: 50%;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      transition: all 0.3s ease;
    }

    #editor-container.hidden {
      height: 0;
      overflow: hidden;
    }

    #floating-toggle {
      position: fixed;
      bottom: 10px;
      left: 10px;
      z-index: 1000;
      background-color: #ab47bc;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 8px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.3s ease;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    #floating-toggle.visible {
      opacity: 1;
    }

    body.dark-theme #floating-toggle {
      background-color: #5e35b1;
    }

    #toolbar {
      display: flex;
      position: sticky; 
      top: 0; 
      left: 0;
      z-index: 100;
      width: 100%;
      justify-content: flex-start;
      padding: 8px;
      background-color: #e1bee7;
      box-sizing: border-box;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
    }

    .toolbar-btn {
      margin-left: 0px;
      padding: 8px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      height: 41px;
      box-sizing: border-box;
    }

    .save-btn {
      background-color: #ab47bc;
      color: white;
      margin-right: 20px;
    }
    
    .run-btn {
      background-color: #ab47bc;
      color: white;
      margin-right: 3px;
    }

    .theme-toggle-btn {
      margin-right: auto;
      margin-left: 4px;
    }

    .reset-btn {
      cursor: pointer;
      border: none;
      background: none;
      color: #6a1b9a;
      font-size: 23px;
      margin-left: 3px;
    }
    
    /* Overriding the background for all languages in both light and dark themes */
    .CodeMirror {
      height: 100%;
      font-size: 14px;
      border: none;
      background-color: #f3e5f5 !important;
      color: #6a1b9a !important;
      line-height: 1.2;
    }

    /* Dark theme background for all languages */
    body.dark-theme .CodeMirror {
      background-color: #2d2d2d !important; 
      color: #fff !important; 
    }

    .CodeMirror-c {
      background-color: #f3e5f5 !important;
    }

    body.dark-theme .CodeMirror-c {
      background-color: #2d2d2d !important;
      color: #fff;
    }

    .CodeMirror-cpp {
      background-color: #f3e5f5 !important;
    }

    body.dark-theme .CodeMirror-cpp {
      background-color: #2d2d2d !important; 
    }

    /* Dark theme */
    body.dark-theme {
      background-color: #2d2d2d;
      color: #fff;
    }
    
    body.dark-theme #toolbar {
      background-color: #ac7fb3;
    }

    body.dark-theme .run-btn,
    body.dark-theme .save-btn,
    body.dark-theme .toggle-editor-btn,
    body.dark-theme .color-palette-btn {
      background-color: #5e35b1;
    }

    body.dark-theme .theme-toggle-btn {
      color: #ab47bc;
    }

    body.dark-theme #output {
      background-color: #333;
      color: #fff;
    }

    body.dark-theme .CodeMirror {
      background-color: #ac7fb31e !important;
      color: #fff !important;
    }
    
    /* Line numbers styles */
    .CodeMirror-gutter {
      background-color: transparent;
      width: 0px;
    }

    .CodeMirror-linenumber {
      padding-left: 0px; 
      color: #6a1b9a; 
    }

    /* Dark theme line numbers */
    body.dark-theme .CodeMirror-linenumber {
      color: #fff; 
    }

    /* Optional */
    .CodeMirror-gutter {
      background-color: #f3e5f5;
    }

    body.dark-theme .CodeMirror-gutter {
      background-color: #ac7fb35d; 
    }

    #language-select {
      background-color: #ba68c8; 
      color: #fff;    
      border: none;
      border-radius: 4px;
      padding: 8px 12px;
      font-size: 16px;
      margin-left: 2px;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
    }

    body.dark-theme #language-select {
      background-color: #5e35b1;
      color: white;
    }

    /* Toggle Editor Button */
    .toggle-editor-btn {
      background-color: #ab47bc;
      color: white;
      margin-right: 3px;
    }

    /* Color Palette Button */
    .color-palette-btn {
      background-color: #ab47bc;
      color: white;
      margin-right: 3px;
    }

    /* Color Palette Modal */
    #color-palette-modal {
      display: none;
      position: fixed;
      bottom: 55px;
      right: 10px;
      width: 300px;
      height: 380px;
      background-color: #fff;
      border: 1px solid #b39ddb;
      border-radius: 4px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      z-index: 1000;
      overflow: hidden;
    }

    body.dark-theme #color-palette-modal {
      background-color: #333;
      border-color: #5e35b1;
    }

    #color-palette-iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Close button for color palette */
    #close-palette {
      position: absolute;
      top: 5px;
      right: 5px;
      background: none;
      border: none;
      color: #6a1b9a;
      font-size: 18px;
      cursor: pointer;
    }

    body.dark-theme #close-palette {
      color: #fff;
    }
    
    /* Hamburger Menu Styling */
    .hamburger-menu {
      position: relative;
      margin-right: 20px;
    }
    
    .hamburger-btn {
      background-color: #ab47bc;
      color: white;
    }
    
    body.dark-theme .hamburger-btn {
      background-color: #5e35b1;
    }
    
    #hamburger-dropdown {
      display: none;
      position: absolute;
      right: 0;
      top: 100%;
      background-color: white;
      border: 1px solid #b39ddb;
      border-radius: 4px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      z-index: 1000;
      width: 120px;
    }
    
    body.dark-theme #hamburger-dropdown {
      background-color: #333;
      border-color: #5e35b1;
    }
    
    .dropdown-item {
      display: block;
      width: 100%;
      padding: 10px 15px;
      text-align: left;
      background: none;
      border: none;
      cursor: pointer;
      color: #6a1b9a;
      font-size: 14px;
      font-weight: bold;
    }
    
    body.dark-theme .dropdown-item {
      color: white;
    }
    
    .dropdown-item:hover {
      background-color: #f3e5f5;
    }
    
    body.dark-theme .dropdown-item:hover {
      background-color: #4a148c;
    }
  </style>
</head>

<body>

  <iframe id="output"></iframe>

  <div id="editor-container">
    <div id="toolbar">
      <select id="language-select" class="toolbar-btn">
        <option value="html">HTML/CSS/JS</option>
        <option value="python">Python</option>
        <option value="php">PHP</option>
        <option value="c">C</option>
        <option value="cpp">C++</option>
      </select>

      <button class="toolbar-btn theme-toggle-btn" onclick="toggleTheme()">
        <img src="https://i.imgur.com/QulpJwQ.png" alt="Sun" id="theme-icon" style="width: 25px; height: 25px;">
      </button>
      
      <button class="reset-btn" onclick="resetCode()">
        <img src="https://i.imgur.com/c5sAii4.png" alt="Reset" style="width: 24px; height: 24px;">
      </button>
      
      <button class="toolbar-btn toggle-editor-btn" onclick="toggleEditor()">
        <img src="https://i.imgur.com/AJhiFLC.png" alt="Toggle Editor" id="toggle-editor-icon" class="toolbar-icon" style="width: 25px; height: 25px;">
      </button>
      
      <button class="toolbar-btn color-palette-btn" onclick="toggleColorPalette()">
        <img src="https://i.imgur.com/luFRnSw.png" alt="Color Palette" id="color-palette-icon" class="toolbar-icon" style="width: 25px; height: 25px;">
      </button>
      
      <!-- Hamburger menu for Run and Save -->
      <div class="hamburger-menu">
        <button class="toolbar-btn hamburger-btn" onclick="toggleHamburgerMenu()">
          <img src="https://i.imgur.com/3fjuWkA.png" alt="Menu" id="hamburger-icon" class="toolbar-icon" style="width: 25px; height: 25px;">
        </button>
        
        <div id="hamburger-dropdown">
          <button class="dropdown-item" onclick="runCode()">
            <i class="fas fa-play"></i> Run
          </button>
          
          <button class="dropdown-item" onclick="saveCode()">
            <i class="fas fa-save"></i> Save
          </button>
        </div>
      </div>
    </div>
    <div id="editor"></div>
  </div>

<!-- Floating toggle -->
  <button id="floating-toggle" onclick="toggleEditor()">
    <img src="https://i.imgur.com/AJhiFLC.png" alt="Show Editor" class="toolbar-icon" style="width: 25px; height: 25px;">
  </button>

  <!-- Color Palette Modal -->
  <div id="color-palette-modal">
    <button id="close-palette" onclick="toggleColorPalette()">×</button>
    <iframe id="color-palette-iframe" src="https://colorhunt.co/"></iframe>
  </div>

  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  
  <script>
    let editor = CodeMirror(document.getElementById('editor'), {
      lineNumbers: true,
      mode: "htmlmixed",
      theme: "default",
      value: localStorage.getItem('savedCode') || '',
      lineWrapping: true,
      lineSeparator: null, 
      electricChars: false,
      extraKeys: {
        "Enter": function(cm) {
          cm.replaceSelection("\n");
        }
      }
    });
    
    let editorVisible = true;

    function toggleEditor() {
      const editorContainer = document.getElementById('editor-container');
      const outputElement = document.getElementById('output');
      const floatingToggle = document.getElementById('floating-toggle');
      
      editorVisible = !editorVisible;

      if (editorVisible) {
        // Show editor
        editorContainer.classList.remove('hidden');
        outputElement.classList.remove('expanded');
        floatingToggle.classList.remove('visible');
      } else {
        // Hide editor and show only output
        editorContainer.classList.add('hidden');
        outputElement.classList.add('expanded');
        floatingToggle.classList.add('visible');
      }

      // Toggle button visibility
      setTimeout(() => {
        editor.refresh();
        window.dispatchEvent(new Event('resize'));
      }, 300);
    }

    // Toggle color palette
    function toggleColorPalette() {
      const paletteModal = document.getElementById('color-palette-modal');
      if (paletteModal.style.display === 'block') {
        paletteModal.style.display = 'none';
      } else {
        paletteModal.style.display = 'block';
      }
    }

    function updateMode() {
      const lang = document.getElementById('language-select').value;
      const modes = {
        html: 'htmlmixed',
        python: 'python',
        php: 'php',
        c: 'text/x-csrc',
        cpp: 'text/x-c++src'
      };
      editor.setOption("mode", modes[lang]);
    }

    document.getElementById('language-select').addEventListener('change', updateMode);

     async function runCode() {
      const code = editor.getValue();
      const language = document.getElementById('language-select').value;
      const outputFrame = document.getElementById('output');
    
      if (language === 'html') {
        const isDark = document.body.classList.contains('dark-theme');
        const defaultStyles = `
          <style>
            body { 
              font-family: "Times New Roman", arial;
              background-color: ${isDark ? '#333' : '#fff'}; 
              color: ${isDark ? '#fff' : '#000'}; 
              margin: 20px auto auto 15px; 
              text-align: justified;
              margin-top: 20px;
              font-size: 18px;
            }
          </style>
        `;
        const htmlContent = `
          <!DOCTYPE html>
          <html lang="en">
          <head>${defaultStyles}</head>
          <body>${code}</body>
          </html>
        `;
        outputFrame.srcdoc = htmlContent;
      } else {
        let fileName = 'code';
        if (language === 'c') fileName = 'code.c';
        else if (language === 'cpp') fileName = 'code.cpp';
        else if (language === 'php') fileName = 'code.php';
        else if (language === 'python') fileName = 'code.py';
    
        const response = await fetch('https://emkc.org/api/v2/piston/execute', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            language: language,
            version: '*',
            files: [{ name: fileName, content: code }],
          }),
        });
    
        const result = await response.json();
        const output = result.run.output || result.run.error;
        outputFrame.srcdoc = `
          <pre style="color: ${
            document.body.classList.contains('dark-theme') ? '#fff' : '#000'
          }; background-color: ${
            document.body.classList.contains('dark-theme') ? '#333' : '#fff'
          }; padding: 10px;">${output}</pre>`;
      }
      document.getElementById('hamburger-dropdown').style.display = 'none';
    }

    function saveCode() {
      const code = editor.getValue();
      const fileName = prompt("Enter a name for your file:", "my-code.html");
      if (fileName) {
        const blob = new Blob([code], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        a.click();
        URL.revokeObjectURL(url);
      }
      document.getElementById('hamburger-dropdown').style.display = 'none';
    }

    function toggleTheme() {
      document.body.classList.toggle('dark-theme');
      
      // Update editor theme
      editor.setOption("theme", document.body.classList.contains('dark-theme') ? "dracula" : "default");
      
      // Update output if already rendered
      if (document.getElementById('output').srcdoc) {
        runCode();
      }
    }
    
    // Toggle hamburger menu
    function toggleHamburgerMenu() {
      const dropdown = document.getElementById('hamburger-dropdown');
      dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
      
      // Close the menu when clicking outside
      if (dropdown.style.display === 'block') {
        document.addEventListener('click', closeHamburgerOnClickOutside);
      } else {
        document.removeEventListener('click', closeHamburgerOnClickOutside);
      }
    }
    
    // Close hamburger menu when clicking outside
    function closeHamburgerOnClickOutside(event) {
      const hamburgerBtn = document.querySelector('.hamburger-btn');
      const dropdown = document.getElementById('hamburger-dropdown');
      
      if (!hamburgerBtn.contains(event.target) && !dropdown.contains(event.target)) {
        dropdown.style.display = 'none';
        document.removeEventListener('click', closeHamburgerOnClickOutside);
      }
    }

    function resetCode() {
      editor.setValue('');
      document.getElementById('output').srcdoc = '';
    }

    // Keyboard Shortcuts for kuan2
    document.addEventListener('keydown', function(event) {
      if (event.ctrlKey && event.key === 'Enter') {
        runCode();
      } else if (event.ctrlKey && event.key === 's') {
        event.preventDefault();
        saveCode();
      } else if (event.ctrlKey && event.key === 'h') {
        // Toggle editor visibility with Ctrl+H
        toggleEditor();
      } else if (event.ctrlKey && event.key === 'p') {
        // Toggle color palette with Ctrl+P
        event.preventDefault();
        toggleColorPalette();
      } else if (event.ctrlKey && event.key === 'm') {
        // Toggle hamburger menu with Ctrl+M
        event.preventDefault();
        toggleHamburgerMenu();
      }
    });

    // Save on typing
    editor.on('change', () => {
      localStorage.setItem('savedCode', editor.getValue());
    });
    
    editor.on('paste', function(cm, e) {
      setTimeout(function() {
        const cursor = cm.getCursor();
        const text = cm.getValue();
        const cleanedText = text.replace(/\n\s*\n/g, '\n');
        cm.setValue(cleanedText);
        cm.setCursor(cursor);
      }, 0);
    });

    updateMode();

    // Handle window resize
    window.addEventListener('resize', function() {
      editor.refresh();
    });
  </script>
</body>
</html>
