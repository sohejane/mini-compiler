<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" href="https://i.imgur.com/Cb6agMF.png" type="image/x-icon">
  <title>soheng's mini compiler</title>

  <!-- CodeMirror CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/htmlmixed/htmlmixed.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/php/php.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/clike/clike.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/theme/dracula.min.css">
  
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background-color: #f3e5f5;
      color: #6a1b9a;
      transition: background-color 0.3s, color 0.3s;
    }

    #output {
      flex: 1;
      border: 1px solid #b39ddb;
      height: 50%;
      overflow: auto;
      background-color: #fff;
      color: #6a1b9a;
    }

    #editor-container {
      height: calc(65vh - 55px);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    #toolbar {
      display: flex;
      position: fixed;
      z-index: 100;
      width: 100%;
      justify-content: flex-start;
      padding: 8px;
      background-color: #e1bee7;
    }

    .toolbar-btn {
      margin-left: 5px;
      padding: 8px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .save-btn {
      background-color: #ab47bc;
      color: white;
      margin-right: 20px;
    }
    
    .run-btn {
      background-color: #ab47bc;
      color: white;
      margin-right: 3px;
    }

    .theme-toggle-btn {
      margin-right: auto;
    }

    .reset-btn {
      cursor: pointer;
      border: none;
      background: none;
      color: #6a1b9a;
      font-size: 23px;
      margin-left: 3px;
    }
    
    /* Override the background for all languages in both light and dark themes */
.CodeMirror {
  height: 100%;
      font-size: 14px;
      border: none;
  background-color: #f3e5f5 !important; /* Default light theme background */
  color: #6a1b9a !important; /* Default text color */
  margin-top: 55px;
}

/* Dark theme background for all languages */
body.dark-theme .CodeMirror {
  background-color: #2d2d2d !important; /* Dark theme background */
  color: #fff !important; /* Dark theme text color */
}

/* Override for C language mode */
.CodeMirror-c {
  background-color: #f3e5f5 !important; /* Light theme background */
}

/* Dark theme background for C language mode */
body.dark-theme .CodeMirror-c {
  background-color: #2d2d2d !important; /* Dark theme background */
  color: #fff;
}

/* Override for C++ language mode */
.CodeMirror-cpp {
  background-color: #f3e5f5 !important; /* Light theme background */
}

/* Dark theme background for C++ language mode */
body.dark-theme .CodeMirror-cpp {
  background-color: #2d2d2d !important; /* Dark theme background */
}

    /* Dark theme */
    body.dark-theme {
      background-color: #2d2d2d;
      color: #fff;
    }

    body.dark-theme #toolbar {
      background-color: #ac7fb3;
    }

    body.dark-theme .run-btn,
    body.dark-theme .save-btn {
      background-color: #5e35b1;
    }

    body.dark-theme .theme-toggle-btn {
      color: #ab47bc;
    }

    body.dark-theme #output {
      background-color: #333;
      color: #fff;
    }

    body.dark-theme .CodeMirror {
      background-color: #ac7fb31e !important;
      color: #fff !important;
    }
    
    /* Adjust line numbers styles */
  .CodeMirror-gutter {
    background-color: transparent;
    width: 0px /* Reduce the space occupied by the line numbers */
  }

  .CodeMirror-linenumber {
    padding-left: 0px; /* Move the line numbers a bit to the left */
    color: #6a1b9a; /* Default color for line numbers */
  }

  /* Dark theme line numbers */
  body.dark-theme .CodeMirror-linenumber {
    color: #fff; /* White line numbers in dark theme */
  }

  /* Optional: Adjust gutter background color */
  .CodeMirror-gutter {
    background-color: #f3e5f5; /* Light theme background */
  }

  body.dark-theme .CodeMirror-gutter {
    background-color: #ac7fb35d; /* Dark theme background */
  }

    #language-select {
      background-color: #ba68c8; /* Light purple background */
      color: #fff;            /* Darker purple text */
      border: none;
      border-radius: 4px;
      padding: 8px 12px;
      font-size: 16px;
      margin-left: 5px;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
    }

    body.dark-theme #language-select {
      background-color: #5e35b1;
      color: white;
    }
  </style>
</head>
<body>

  <iframe id="output"></iframe>

  <div id="editor-container">
    <div id="toolbar">
      <select id="language-select" class="toolbar-btn">
        <option value="html">HTML/CSS/JS</option>
        <option value="python">Python</option>
        <option value="php">PHP</option>
        <option value="c">C</option>
        <option value="cpp">C++</option>
      </select>

      <button class="toolbar-btn theme-toggle-btn" onclick="toggleTheme()">
        <img src="https://i.imgur.com/QulpJwQ.png" alt="Sun" id="theme-icon" style="width: 25px; height: 25px;">
      </button>
      <button class="reset-btn" onclick="resetCode()">
        <img src="https://i.imgur.com/c5sAii4.png" alt="Reset" style="width: 24px; height: 24px;">
      </button>
      <button class="toolbar-btn run-btn" onclick="runCode()">
        <i class="fas fa-play"></i> Run
      </button>
      <button class="toolbar-btn save-btn" onclick="saveCode()">
        <i class="fas fa-save"></i> Save
      </button>
    </div>
    <div id="editor"></div>
  </div>

  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <script>
    let editor = CodeMirror(document.getElementById('editor'), {
  lineNumbers: true,
  mode: "htmlmixed",
  theme: "default",
  value: localStorage.getItem('savedCode') || '',
  lineWrapping: true,  // Enable word wrapping
});
    

    function updateMode() {
      const lang = document.getElementById('language-select').value;
      const modes = {
        html: 'htmlmixed',
        python: 'python',
        php: 'php',
        c: 'text/x-csrc',
        cpp: 'text/x-c++src'
      };
      editor.setOption("mode", modes[lang]);
    }

    document.getElementById('language-select').addEventListener('change', updateMode);

    async function runCode() {
      const code = editor.getValue();
      const language = document.getElementById('language-select').value;
      const outputFrame = document.getElementById('output');

      if (language === 'html') {
        const isDark = document.body.classList.contains('dark-theme');
        const style = isDark ? `<style>body { background-color: #333; color: white; }</style>` : '';
        outputFrame.srcdoc = style + code;
      } else {
        let fileName = 'code';
        if (language === 'c') fileName = 'code.c';
        else if (language === 'cpp') fileName = 'code.cpp';
        else if (language === 'php') fileName = 'code.php';
        else if (language === 'python') fileName = 'code.py';

        const response = await fetch('https://emkc.org/api/v2/piston/execute', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            language: language,
            version: '*',
            files: [{ name: fileName, content: code }],
          }),
        });

        const result = await response.json();
        const output = result.run.output || result.run.error;
        outputFrame.srcdoc = `<pre style="color: ${
          document.body.classList.contains('dark-theme') ? '#fff' : '#000'
        }; background-color: ${
          document.body.classList.contains('dark-theme') ? '#333' : '#fff'
        }; padding: 10px;">${output}</pre>`;
      }
    }

    function saveCode() {
      const code = editor.getValue();
      const fileName = prompt("Enter a name for your file:", "my-code.html");
      if (fileName) {
        const blob = new Blob([code], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        a.click();
        URL.revokeObjectURL(url);
      }
    }

    function toggleTheme() {
      document.body.classList.toggle('dark-theme');
      document.getElementById('theme-icon').src =
        document.body.classList.contains('dark-theme')
          ? "https://i.imgur.com/iYSdLh5.png"
          : "https://i.imgur.com/QulpJwQ.png";
      editor.setOption("theme", document.body.classList.contains('dark-theme') ? "dracula" : "default");
    }

    function resetCode() {
      editor.setValue('');
      document.getElementById('output').srcdoc = '';
    }

    // Keyboard Shortcuts
    document.addEventListener('keydown', function(event) {
      if (event.ctrlKey && event.key === 'Enter') {
        runCode();
      } else if (event.ctrlKey && event.key === 's') {
        event.preventDefault();
        saveCode();
      }
    });

    // Save on typing
    editor.on('change', () => {
      localStorage.setItem('savedCode', editor.getValue());
    });

    // Set initial language mode
    updateMode();
  </script>
</body>
</html>
